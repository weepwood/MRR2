name: 展开原型源码

on:
  push:
    paths:
      - prototype.bundle.complete

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 展开原型源码
        shell: bash
        run: |
          cat prototype.bundle.part-* | base64 --decode > /tmp/mrr2-prototype.tar.gz
          echo "bd84d90dd55933bc81d42cb6d93d27a7aaaf6cdf1f3b452f0f4698f9aed172fe  /tmp/mrr2-prototype.tar.gz" | sha256sum --check
          tar -xzf /tmp/mrr2-prototype.tar.gz
          rm -f prototype.bundle.part-* prototype.bundle.complete .github/workflows/bootstrap.yml
      - name: 提交完整原型
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "实现 MRR2 清爽科技极简视觉原型"
          git push
