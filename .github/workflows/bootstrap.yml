name: 展开原型源码

on:
  push:
    paths:
      - prototype.bundle.tar.gz.b64

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 展开原型源码
        shell: bash
        run: |
          base64 --decode prototype.bundle.tar.gz.b64 > /tmp/mrr2-prototype.tar.gz
          tar -xzf /tmp/mrr2-prototype.tar.gz
          rm -f prototype.bundle.tar.gz.b64 .github/workflows/bootstrap.yml
      - name: 提交完整原型
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "实现 MRR2 清爽科技极简视觉原型"
          git push
