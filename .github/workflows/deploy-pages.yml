name: 部署 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 类型检查并构建
        run: pnpm build

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 构件
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: 记录部署结果
    if: always()
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: 写入提交状态
        uses: actions/github-script@v8
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const success = process.env.DEPLOY_RESULT === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'GitHub Pages',
              description: success ? 'GitHub Pages 部署成功' : 'GitHub Pages 部署失败',
              target_url: process.env.PAGE_URL || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions`,
            })
