name: 部署 GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - DEPLOYMENT_STATUS.md
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 类型检查并构建
        run: pnpm build

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 构件
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: 记录部署结果
    if: always()
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: 检出主分支
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 写入部署结果
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            STATUS="成功"
          else
            STATUS="失败"
          fi

          cat > DEPLOYMENT_STATUS.md <<EOF
          # GitHub Pages 部署状态

          - 状态：${STATUS}
          - 构建结果：${BUILD_RESULT}
          - 部署结果：${DEPLOY_RESULT}
          - 页面地址：${PAGE_URL:-https://weepwood.github.io/MRR2/}
          - 工作流提交：${GITHUB_SHA}
          - 更新时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "记录 GitHub Pages 部署状态 [skip ci]"
            git push
          fi
